name: Tag a release
description: >-
  When the checked out commit is a "Bump version X.Y.Z" commit, create the
  vX.Y.Z tag on it and the GitHub release, whose notes are the X.Y.Z section
  of CHANGELOG.md. Any other commit is left alone. Running it again on the same
  commit does nothing.

inputs:
  token:
    description: Token creating the tag and the release (needs contents write)
    default: ${{ github.token }}

outputs:
  version:
    description: Released version, empty when the commit is not a release commit
    value: ${{ steps.tag.outputs.version }}

runs:
  using: composite
  steps:
    - id: tag
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        subject=$(git log -1 --format=%s HEAD)
        # A squash merge appends the PR number to the subject
        if ! [[ "$subject" =~ ^Bump\ version\ ([0-9]+\.[0-9]+\.[0-9]+)(\ \(#[0-9]+\))?$ ]]; then
          echo "Not a release commit: $subject"
          exit 0
        fi
        version="${BASH_REMATCH[1]}"
        tag="v$version"
        sha=$(git rev-parse HEAD)

        tagged_sha=$(git ls-remote origin "refs/tags/$tag^{}" "refs/tags/$tag" | head -n 1 | cut -f 1)
        if [ -n "$tagged_sha" ] && [ "$tagged_sha" != "$sha" ]; then
          echo "::error::Tag $tag already exists on another commit ($tagged_sha)"
          exit 1
        fi

        python3 "$GITHUB_ACTION_PATH/../release.py" notes "$version" --output "$RUNNER_TEMP/release-notes.md"
        if [ -z "$tagged_sha" ]; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$tag" --message "Version $version" "$sha"
          git push --quiet origin "refs/tags/$tag"
        fi
        if gh release view "$tag" > /dev/null 2>&1; then
          echo "Release $tag already exists"
        else
          gh release create "$tag" --verify-tag --title "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
