name: Prepare a release
description: >-
  Add the changelog section of a release, update publiccode.yml when the
  repository has one, and open the "Bump version X.Y.Z" pull request.

inputs:
  version:
    description: Version to release, as MAJOR.MINOR.PATCH
    required: true
  breaking:
    description: Comma separated numbers of the PRs to mark as breaking changes
    default: ""
  token:
    description: >-
      Token opening the pull request. A pull request opened with the default
      GITHUB_TOKEN does not trigger the GitHub Actions workflows of the
      repository, use a GitHub App token if checks are required to merge.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Check the release can be prepared
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
          echo "::error::A release is prepared from $DEFAULT_BRANCH, not from $GITHUB_REF_NAME"
          exit 1
        fi
        if git ls-remote --exit-code --heads origin "release/v$VERSION" > /dev/null; then
          echo "::error::Branch release/v$VERSION already exists"
          exit 1
        fi
        # The changelog lists the commits since the previous tag
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          git fetch --quiet --unshallow --tags origin
        else
          git fetch --quiet --tags origin
        fi

    - name: Update the changelog
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        BREAKING: ${{ inputs.breaking }}
      run: python3 "$GITHUB_ACTION_PATH/../release.py" prepare "$VERSION" --breaking "$BREAKING" --body-file "$RUNNER_TEMP/release-body.md"

    - name: Open the pull request
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        branch="release/v$VERSION"
        # The person who launched the release
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
        git switch --quiet --create "$branch"
        git add CHANGELOG.md
        if [ -f publiccode.yml ]; then
          git add publiccode.yml
        fi
        git commit --quiet --message "Bump version $VERSION"
        git push --quiet origin "$branch"
        gh pr create \
          --base "$GITHUB_REF_NAME" \
          --head "$branch" \
          --title "Bump version $VERSION" \
          --body-file "$RUNNER_TEMP/release-body.md"
