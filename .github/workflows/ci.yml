---
name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Python version used to build and publish the distribution
  PYTHON_VERSION: "3.11"

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        mongo-version: ["7.0.28"]
        elasticsearch-version: ["7.17.28", "8.19.13"]
    env:
      UDATA_TEST_SEARCH_INTEGRATION: "1"
      UDATA_TEST_S3_INTEGRATION: "1"
      UDATA_TEST_S3_ENDPOINT: "http://localhost:9000"
      UDATA_TEST_S3_ACCESS_KEY: "udata"
      UDATA_TEST_S3_SECRET_KEY: "udata-secret"
    services:
      mongo:
        image: mongo:${{ matrix.mongo-version }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      s3:
        image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
        env:
          RUSTFS_ACCESS_KEY: udata
          RUSTFS_SECRET_KEY: udata-secret
        ports:
          - 9000:9000
        # The image declares no healthcheck, without one the job would not
        # wait for the server to be up
        options: >-
          --health-cmd "curl -sf http://localhost:9000/health"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      elasticsearch:
        image: elasticsearch:${{ matrix.elasticsearch-version }}
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          action.destructive_requires_name: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        # The analysis-icu plugin is not bundled with the image
        command: >-
          bash -c "elasticsearch-plugin install --batch analysis-icu && /usr/local/bin/docker-entrypoint.sh eswrapper"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Lint and format code and sort imports
        # ruff check --extend-select I . : check linting and imports sorting without fixing (to fix, use --fix)
        # ruff format --check . : check code formatting without fixing (to fix, remove --check)
        run: |
          uv run ruff check --extend-select I .
          uv run ruff format --check .

      - name: Initialize Elasticsearch indices
        run: |
          echo 'ELASTICSEARCH_URL = "http://localhost:9200"' > udata.cfg
          echo 'API_TOKEN_SECRET = "ci-secret"' >> udata.cfg
          uv run udata search init-es

      - name: Run tests
        run: |
          mkdir -p reports/python
          uv run inv test --report --ci

      - name: Store test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-py${{ matrix.python-version }}-es${{ matrix.elasticsearch-version }}
          path: reports/

  dist:
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # setuptools_scm derives the version from the tag history
          fetch-depth: 0

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build a distributable package as a wheel release
        run: uv run inv pydist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: dist
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Publish on PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: uv publish dist/*.whl
