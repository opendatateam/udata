---
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (MAJOR.MINOR.PATCH)
        required: true
      breaking:
        description: Numbers of the PRs to mark as breaking changes (comma separated)
        default: ""
  pull_request:
    types: [synchronize]
    branches: [main]

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/reusable-release.yml
    with:
      version: ${{ inputs.version }}
      breaking: ${{ inputs.breaking }}
