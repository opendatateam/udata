---
# Release pull request, shared by the repositories releasing through it.
#
# On workflow_dispatch: add the changelog section of the version, update
# publiccode.yml when the repository has one, and open the
# "Bump version X.Y.Z" pull request from a release/vX.Y.Z branch.
#
# On a push to a release/vX.Y.Z pull request: regenerate the changelog section
# from the commits of the base branch the release branch contains, so that
# updating the branch with the base branch adds what was merged meanwhile.
name: Release (reusable)

on:
  workflow_call:
    inputs:
      version:
        description: Version to release, as MAJOR.MINOR.PATCH (workflow_dispatch only)
        type: string
        default: ""
      breaking:
        description: Comma separated numbers of the PRs to mark as breaking changes
        type: string
        default: ""
    secrets:
      token:
        description: >-
          Token pushing the release branch and opening the pull request. What
          the default GITHUB_TOKEN does triggers no workflow, so the CI does not
          run on the release pull request: use a GitHub App token if checks are
          required to merge.
        required: false

defaults:
  run:
    # An explicit bash shell runs with -eo pipefail
    shell: bash

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check the release can be prepared
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::A release is prepared from $DEFAULT_BRANCH, not from $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changelog lists the commits since the previous tag
          fetch-depth: 0
          token: ${{ secrets.token || github.token }}

      - name: Update the changelog
        env:
          VERSION: ${{ inputs.version }}
          BREAKING: ${{ inputs.breaking }}
        run: |
          if git ls-remote --exit-code --heads origin "release/v$VERSION" > /dev/null; then
            echo "::error::Branch release/v$VERSION already exists"
            exit 1
          fi
          python3 .github/release/release.py prepare "$VERSION" --breaking "$BREAKING" --body-file "$RUNNER_TEMP/release-body.md"

      - name: Open the pull request
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.token || github.token }}
        run: |
          branch="release/v$VERSION"
          # The person who launched the release
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          git switch --quiet --create "$branch"
          git add CHANGELOG.md
          if [ -f publiccode.yml ]; then
            git add publiccode.yml
          fi
          git commit --quiet --message "Bump version $VERSION"
          git push --quiet origin "$branch"
          gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$branch" \
            --title "Bump version $VERSION" \
            --body-file "$RUNNER_TEMP/release-body.md"

  refresh:
    # A pull request from a fork gets a read-only token, release branches live
    # in the repository
    if: >-
      github.event_name == 'pull_request'
      && startsWith(github.head_ref, 'release/v')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release branch itself, not the merge ref of the pull request
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.token || github.token }}

      - name: Regenerate the changelog
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ secrets.token || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          version="${HEAD_REF#release/v}"
          base=$(git merge-base HEAD "origin/$BASE_REF")
          python3 .github/release/release.py refresh "$version" --ref "$base" --body-file "$RUNNER_TEMP/release-body.md"
          if git diff --quiet; then
            exit 0
          fi

          # The person who updated the release branch
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          git commit --quiet --all --message "Update the changelog of $version"
          git push --quiet origin "$HEAD_REF"
          gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/release-body.md"
