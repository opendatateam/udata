# Read the Docs configuration file for MkDocs projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

mkdocs:
  configuration: mkdocs.yml

# MkDocs itself is installed by Read the Docs. The package is installed for the
# `mkdocs.yml` config to resolve, no extra is needed: the docs are plain markdown.
python:
  install:
  - method: pip
    path: .
