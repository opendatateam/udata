---
version: 2.1

parameters:
  python-version:
    type: string
    default: "3.11"
  publish-branch:
    type: string
    default: "main"
    description: "Branch to publish to PyPi and trigger the Gitlab CI/CD pipeline when pushed to"
  deploy-env:
    type: string
    default: "dev"
    description: "Environment to deploy to"

jobs:
  python:
    parameters:
      python-version:
        type: string
      mongo-version:
        type: string
      elasticsearch-version:
        type: string
    docker:
      - image: ghcr.io/astral-sh/uv:python<< parameters.python-version >>-trixie
      - image: mongo:<< parameters.mongo-version >>
      - image: redis:alpine
      # MinIO images are no longer published on Docker Hub, quay.io is the only registry left
      - image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
        environment:
          MINIO_ROOT_USER: udata
          MINIO_ROOT_PASSWORD: udata-secret
        command: ["server", "/data"]
      - image: elasticsearch:<< parameters.elasticsearch-version >>
        environment:
          discovery.type: single-node
          xpack.security.enabled: "false"
          action.destructive_requires_name: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        command:
          [
            "bash",
            "-c",
            "elasticsearch-plugin install --batch analysis-icu && /usr/local/bin/docker-entrypoint.sh eswrapper",
          ]
    environment:
      BASH_ENV: /root/.bashrc
      UDATA_TEST_SEARCH_INTEGRATION: "1"
      UDATA_TEST_S3_INTEGRATION: "1"
      UDATA_TEST_S3_ENDPOINT: "http://localhost:9000"
      UDATA_TEST_S3_ACCESS_KEY: "udata"
      UDATA_TEST_S3_SECRET_KEY: "udata-secret"
    steps:
      - checkout
      - run:
          name: Get the base reference branch
          command: export BASE_BRANCH=$(base_branch)
      - restore_cache:
          keys:
            # 1. Exact match of dependencies
            - py<< parameters.python-version >>-cache-v1-{{ arch }}-{{ checksum "pyproject.toml" }}-{{ checksum "uv.lock" }}
            # 2. Latest cache from this branch
            - py<< parameters.python-version >>-cache-v1-{{ arch }}-{{ .Branch }}
            # 3. Latest cache from base branch (e.g., main)
            - py<< parameters.python-version >>-cache-v1-{{ arch }}-{{ .Environment.BASE_BRANCH }}
            # 4. Any latest cache for this architecture (fallback)
            - py<< parameters.python-version >>-cache-v1-{{ arch }}-
      - run:
          name: Install Python dependencies
          command: |
            uv sync --frozen
      - save_cache:
          key: py<< parameters.python-version >>-cache-v1-{{ arch }}-{{ checksum "pyproject.toml" }}-{{ checksum "uv.lock" }}
          paths:
            - .venv
      - save_cache:
          key: py<< parameters.python-version >>-cache-v1-{{ arch }}-{{ .Branch }}
          paths:
            - .venv
      - run:
          name: Lint and format code and sort imports
          # ruff check --extend-select I . : check linting and imports sorting without fixing (to fix, use --fix)
          # ruff format --check . : check code formatting without fixing (to fix, remove --check)
          command: |
            uv run ruff check --extend-select I .
            uv run ruff format --check .
      - run:
          name: Wait for Elasticsearch
          command: |
            apt-get update && apt-get install -y curl jq
            for i in $(seq 1 60); do
              status=$(curl -s http://localhost:9200/_cluster/health 2>/dev/null | jq -r '.status' 2>/dev/null || true)
              if [ "$status" = "green" ] || [ "$status" = "yellow" ]; then
                echo "Elasticsearch is ready (status: $status)"
                exit 0
              fi
              echo "Waiting for Elasticsearch... ($i/60) - status: $status"
              sleep 2
            done
            echo "Elasticsearch failed to start"
            exit 1
      - run:
          name: Wait for MinIO
          command: |
            for i in $(seq 1 30); do
              if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
                echo "MinIO is ready"
                exit 0
              fi
              echo "Waiting for MinIO... ($i/30)"
              sleep 1
            done
            echo "MinIO failed to start"
            exit 1
      - run:
          name: Initialize Elasticsearch indices
          command: |
            echo 'ELASTICSEARCH_URL = "http://localhost:9200"' > udata.cfg
            echo 'API_TOKEN_SECRET = "ci-secret"' >> udata.cfg
            uv run udata search init-es
      - run:
          name: Run tests
          command: |
            mkdir -p reports/python
            # Redirect stdin from /dev/null to avoid an invoke v3 crash:
            # handle_stdin thread calls tcgetpgrp(stdin) which fails with
            # ENOTTY on CircleCI when stdin is a TTY-flagged char device
            # but the inv process isn't the session leader. /dev/null is
            # not a TTY, so invoke's isatty() check short-circuits cleanly.
            uv run inv test --report --ci < /dev/null
      - store_test_results:
          path: reports/python
      - store_artifacts:
          path: reports/
          destination: reports

  dist:
    docker:
      - image: ghcr.io/astral-sh/uv:python<< pipeline.parameters.python-version >>-trixie
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            uv sync --frozen
            uv pip install setuptools-scm
      - run:
          name: Save and show RELEASE_VERSION
          command: |
            # derive from setuptools_scm or base version + build number
            RELEASE_VERSION=$(uv run python -m setuptools_scm)

            echo "export RELEASE_VERSION=$RELEASE_VERSION" > release.env
            echo "RELEASE_VERSION is $RELEASE_VERSION"
      - run:
          name: Build a distributable package as a wheel release
          command: |
            uv run inv pydist < /dev/null
      - store_artifacts:
          path: dist
      - persist_to_workspace:
          root: .
          paths:
            - dist
            - release.env

  publish:
    docker:
      - image: ghcr.io/astral-sh/uv:python<< pipeline.parameters.python-version >>-trixie
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Publish on PyPI
          command: |
            uv publish dist/*.whl  # use UV_PUBLISH_TOKEN

  create-sentry-release:
    docker:
      - image: cimg/base:stable
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Create Sentry release
          command: |
            source release.env

            # Create release
            curl https://errors.data.gouv.fr/api/0/organizations/sentry/releases/ \
              -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "{\"version\":\"${RELEASE_VERSION}\",\"ref\":\"${CIRCLE_SHA1}\",\"projects\":[\"datagouv\"]}"

            # Create deployment
            curl https://errors.data.gouv.fr/api/0/organizations/sentry/releases/${RELEASE_VERSION}/deploys/ \
              -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "{\"environment\":\"<< pipeline.parameters.deploy-env >>\"}"

workflows:
  build-publish-deploy:
    jobs:
      - python:
          matrix:
            parameters:
              python-version: ["3.11", "3.13"]
              mongo-version: ["7.0.28"]
              elasticsearch-version: ["7.17.28", "8.19.13"]
      - dist:
          requires:
            - python
      - publish:
          requires:
            - dist
          filters:
            branches:
              only:
                - << pipeline.parameters.publish-branch >>
          context: org-global
      - create-sentry-release:
          requires:
            - dist
          filters:
            branches:
              only:
                - << pipeline.parameters.publish-branch >>
          context:
            - org-global
